name: Build and release

# Push a tag like v0.1.0 to build Windows + Linux packages, run every test suite, generate catalog.json from the
# real files, and publish them as a GitHub release.
#   v1.2.3      -> normal release; becomes "latest", so the launcher's default catalog URL picks it up
#   v1.2.3-rc1  -> prerelease; never "latest", so users are not affected (test it by pasting its
#                  .../releases/download/<tag>/catalog.json URL into the launcher's Settings)
# "Run workflow" (workflow_dispatch) builds and uploads artifacts only; it does not publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-22.04 # older glibc => AppImage/deb run on more distros
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # a multi-line step must stop at the first failing command (the Windows default, pwsh, does not)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Tag must match the launcher version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag%%-*}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # scripts/ci-step.sh runs a command normally, but if it fails it also publishes the last lines of its output as an
      # error annotation, so a failed run explains itself (annotations are readable without signing in).
      - name: Launcher - install, test, package
        run: |
          bash scripts/ci-step.sh "Launcher: npm ci" npm ci
          bash scripts/ci-step.sh "Launcher: npm test" npm test
          bash scripts/ci-step.sh "Launcher: package" npm run ${{ matrix.script }}

      - name: Picture Converter
        working-directory: tools/picture-converter
        run: |
          bash ../../scripts/ci-step.sh "Picture Converter: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Picture Converter: npm test" npm test
          bash ../../scripts/ci-step.sh "Picture Converter: package" npm run ${{ matrix.script }}

      - name: Audio Tagger
        working-directory: tools/audio-tagger
        run: |
          bash ../../scripts/ci-step.sh "Audio Tagger: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Audio Tagger: npm test" npm test
          bash ../../scripts/ci-step.sh "Audio Tagger: package" npm run ${{ matrix.script }}

      - name: Audio Converter
        working-directory: tools/audio-converter
        run: |
          bash ../../scripts/ci-step.sh "Audio Converter: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Audio Converter: ffmpeg setup" npm run setup   # downloads the bundled ffmpeg (ffmpeg-static)
          bash ../../scripts/ci-step.sh "Audio Converter: npm test" npm test
          bash ../../scripts/ci-step.sh "Audio Converter: package" npm run ${{ matrix.script }}

      - name: PDF Toolkit
        working-directory: tools/pdf-toolkit
        run: |
          bash ../../scripts/ci-step.sh "PDF Toolkit: npm ci" npm ci
          bash ../../scripts/ci-step.sh "PDF Toolkit: npm test" npm test
          bash ../../scripts/ci-step.sh "PDF Toolkit: package" npm run ${{ matrix.script }}

      - name: Photo Privacy Cleaner
        working-directory: tools/photo-privacy
        run: |
          bash ../../scripts/ci-step.sh "Photo Privacy Cleaner: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Photo Privacy Cleaner: npm test" npm test
          bash ../../scripts/ci-step.sh "Photo Privacy Cleaner: package" npm run ${{ matrix.script }}

      - name: Video Converter
        working-directory: tools/video-converter
        run: |
          bash ../../scripts/ci-step.sh "Video Converter: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Video Converter: ffmpeg setup" npm run setup   # downloads the bundled ffmpeg (ffmpeg-static)
          bash ../../scripts/ci-step.sh "Video Converter: npm test" npm test
          bash ../../scripts/ci-step.sh "Video Converter: package" npm run ${{ matrix.script }}

      - name: Music Player
        working-directory: tools/music-player
        run: |
          bash ../../scripts/ci-step.sh "Music Player: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Music Player: npm test" npm test
          bash ../../scripts/ci-step.sh "Music Player: package" npm run ${{ matrix.script }}

      - name: Audio Editor
        working-directory: tools/audio-editor
        run: |
          bash ../../scripts/ci-step.sh "Audio Editor: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Audio Editor: ffmpeg setup" npm run setup   # downloads the bundled ffmpeg (ffmpeg-static)
          bash ../../scripts/ci-step.sh "Audio Editor: npm test" npm test
          bash ../../scripts/ci-step.sh "Audio Editor: package" npm run ${{ matrix.script }}

      - name: Duplicate Finder
        working-directory: tools/duplicate-finder
        run: |
          bash ../../scripts/ci-step.sh "Duplicate Finder: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Duplicate Finder: ffmpeg setup" npm run setup   # downloads the bundled ffmpeg (ffmpeg-static)
          bash ../../scripts/ci-step.sh "Duplicate Finder: npm test" npm test
          bash ../../scripts/ci-step.sh "Duplicate Finder: package" npm run ${{ matrix.script }}

      - name: Image Text Extractor
        working-directory: tools/ocr
        run: |
          bash ../../scripts/ci-step.sh "Image Text Extractor: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Image Text Extractor: language data" npm run setup   # copies the bundled OCR language files
          bash ../../scripts/ci-step.sh "Image Text Extractor: npm test" npm test
          bash ../../scripts/ci-step.sh "Image Text Extractor: package" npm run ${{ matrix.script }}

      - name: Stem Splitter
        working-directory: tools/stem-splitter
        env:
          ONNXRUNTIME_NODE_INSTALL: skip   # onnxruntime-node would download ~hundreds of MB of CUDA libraries on Linux; this tool is CPU-only
        run: |
          bash ../../scripts/ci-step.sh "Stem Splitter: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Stem Splitter: ffmpeg and model setup" npm run setup   # downloads the bundled ffmpeg and the Demucs model (~136 MB)
          bash ../../scripts/ci-step.sh "Stem Splitter: npm test" npm test   # includes a run of the real model
          bash ../../scripts/ci-step.sh "Stem Splitter: package" npm run ${{ matrix.script }}

      - name: BPM & Key Finder
        working-directory: tools/bpm-key-finder
        run: |
          bash ../../scripts/ci-step.sh "BPM & Key Finder: npm ci" npm ci
          bash ../../scripts/ci-step.sh "BPM & Key Finder: ffmpeg setup" npm run setup   # downloads the bundled ffmpeg (ffmpeg-static)
          bash ../../scripts/ci-step.sh "BPM & Key Finder: npm test" npm test
          bash ../../scripts/ci-step.sh "BPM & Key Finder: package" npm run ${{ matrix.script }}

      - name: Background Remover
        working-directory: tools/background-remover
        env:
          ONNXRUNTIME_NODE_INSTALL: skip   # onnxruntime-node would download ~hundreds of MB of CUDA libraries on Linux; this tool is CPU-only
        run: |
          bash ../../scripts/ci-step.sh "Background Remover: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Background Remover: model setup" npm run setup   # downloads the ISNet model (~170 MB)
          bash ../../scripts/ci-step.sh "Background Remover: npm test" npm test   # includes a run of the real model
          bash ../../scripts/ci-step.sh "Background Remover: package" npm run ${{ matrix.script }}

      - name: Lyrics Maker
        working-directory: tools/lyrics-maker
        env:
          ONNXRUNTIME_NODE_INSTALL: skip   # CPU-only, see above
        run: |
          bash ../../scripts/ci-step.sh "Lyrics Maker: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Lyrics Maker: ffmpeg and model setup" npm run setup   # downloads the bundled ffmpeg and the Whisper model (~250 MB)
          bash ../../scripts/ci-step.sh "Lyrics Maker: npm test" npm test   # runs the real model; the spoken-clip tests need the Windows voices and are skipped on Linux
          bash ../../scripts/ci-step.sh "Lyrics Maker: package" npm run ${{ matrix.script }}


      - name: Text & File Diff
        working-directory: tools/text-diff
        run: |
          bash ../../scripts/ci-step.sh "Text & File Diff: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Text & File Diff: npm test" npm test
          bash ../../scripts/ci-step.sh "Text & File Diff: package" npm run ${{ matrix.script }}

      - name: Batch File Renamer
        working-directory: tools/file-renamer
        run: |
          bash ../../scripts/ci-step.sh "Batch File Renamer: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Batch File Renamer: npm test" npm test
          bash ../../scripts/ci-step.sh "Batch File Renamer: package" npm run ${{ matrix.script }}

      - name: Disk Space Visualizer
        working-directory: tools/disk-space
        run: |
          bash ../../scripts/ci-step.sh "Disk Space Visualizer: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Disk Space Visualizer: npm test" npm test
          bash ../../scripts/ci-step.sh "Disk Space Visualizer: package" npm run ${{ matrix.script }}

      - name: QR & Barcode Studio
        working-directory: tools/qr-studio
        run: |
          bash ../../scripts/ci-step.sh "QR & Barcode Studio: npm ci" npm ci
          bash ../../scripts/ci-step.sh "QR & Barcode Studio: npm test" npm test
          bash ../../scripts/ci-step.sh "QR & Barcode Studio: package" npm run ${{ matrix.script }}

      - name: Password Vault
        working-directory: tools/password-vault
        run: |
          bash ../../scripts/ci-step.sh "Password Vault: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Password Vault: npm test" npm test
          bash ../../scripts/ci-step.sh "Password Vault: package" npm run ${{ matrix.script }}

      - name: File Encryptor & Hasher
        working-directory: tools/file-encryptor
        run: |
          bash ../../scripts/ci-step.sh "File Encryptor & Hasher: npm ci" npm ci
          bash ../../scripts/ci-step.sh "File Encryptor & Hasher: npm test" npm test
          bash ../../scripts/ci-step.sh "File Encryptor & Hasher: package" npm run ${{ matrix.script }}

      - name: Markdown Notes
        working-directory: tools/markdown-notes
        run: |
          bash ../../scripts/ci-step.sh "Markdown Notes: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Markdown Notes: npm test" npm test
          bash ../../scripts/ci-step.sh "Markdown Notes: package" npm run ${{ matrix.script }}

      - name: Ebook Converter & Reader
        working-directory: tools/ebook-studio
        run: |
          bash ../../scripts/ci-step.sh "Ebook Converter & Reader: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Ebook Converter & Reader: npm test" npm test
          bash ../../scripts/ci-step.sh "Ebook Converter & Reader: package" npm run ${{ matrix.script }}

      - name: Voice Recorder & Cleaner
        working-directory: tools/voice-recorder
        run: |
          bash ../../scripts/ci-step.sh "Voice Recorder & Cleaner: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Voice Recorder & Cleaner: ffmpeg setup" npm run setup   # downloads the bundled ffmpeg (ffmpeg-static)
          bash ../../scripts/ci-step.sh "Voice Recorder & Cleaner: npm test" npm test
          bash ../../scripts/ci-step.sh "Voice Recorder & Cleaner: package" npm run ${{ matrix.script }}

      - name: Photo Batch Editor
        working-directory: tools/photo-batch-editor
        run: |
          bash ../../scripts/ci-step.sh "Photo Batch Editor: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Photo Batch Editor: npm test" npm test
          bash ../../scripts/ci-step.sh "Photo Batch Editor: package" npm run ${{ matrix.script }}

      - name: Subtitle Maker
        working-directory: tools/subtitle-maker
        env:
          ONNXRUNTIME_NODE_INSTALL: skip   # CPU-only, see above
        run: |
          bash ../../scripts/ci-step.sh "Subtitle Maker: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Subtitle Maker: ffmpeg and model setup" npm run setup   # downloads the bundled ffmpeg and the Whisper model (~250 MB)
          bash ../../scripts/ci-step.sh "Subtitle Maker: npm test" npm test   # runs the real model; the spoken-clip tests need espeak-ng or the Windows voices and are skipped without them
          bash ../../scripts/ci-step.sh "Subtitle Maker: package" npm run ${{ matrix.script }}

      - name: Audio Inspector
        working-directory: tools/audio-inspector
        run: |
          bash ../../scripts/ci-step.sh "Audio Inspector: npm ci" npm ci
          bash ../../scripts/ci-step.sh "Audio Inspector: ffmpeg setup" npm run setup   # downloads the bundled ffmpeg (ffmpeg-static)
          bash ../../scripts/ci-step.sh "Audio Inspector: npm test" npm test
          bash ../../scripts/ci-step.sh "Audio Inspector: package" npm run ${{ matrix.script }}

      - name: Collect release files into one flat folder
        run: |
          mkdir release
          find dist -maxdepth 1 -type f -name 'ToolsLauncher-*' ! -name '*.blockmap' -exec cp {} release/ \;
          cp tools/*/dist/*-x64.zip release/
          ls -l release
          test "$(ls release | wc -l)" -ge 4

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build # every matrix job must pass, so a broken Linux build can never publish a half catalog
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build catalog.json from the real packages
        run: |
          node scripts/build-catalog.js \
            --artifacts artifacts \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" \
            --out artifacts/catalog.json \
            --require windows,linux
          ls -l artifacts
          cat artifacts/catalog.json

      # Third-party action: consider pinning to a commit SHA instead of a version tag.
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
