name: Build and release

# Push a tag like v0.1.0 to build Windows + Linux packages, run every test suite, generate catalog.json from the
# real files, and publish them as a GitHub release.
#   v1.2.3      -> normal release; becomes "latest", so the launcher's default catalog URL picks it up
#   v1.2.3-rc1  -> prerelease; never "latest", so users are not affected (test it by pasting its
#                  .../releases/download/<tag>/catalog.json URL into the launcher's Settings)
# "Run workflow" (workflow_dispatch) builds, tests and uploads artifacts only; it does not publish.
#
# Every tool is its own job, on Windows and Linux at the same time, so a full build takes about as long as the slowest
# tool instead of all of them one after another, and one failing tool never hides the results of the others. The
# release job waits for every one of them, so a single failure can never publish a half catalog.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A newer run of the same branch or tag replaces one that is still going (a tag release is never cancelled half way).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  ONNXRUNTIME_NODE_INSTALL: skip   # onnxruntime-node would download ~hundreds of MB of CUDA libraries on Linux; the tools are CPU-only

jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the launcher version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag%%-*}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

  launcher:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-22.04 # older glibc => AppImage/deb run on more distros
            script: dist:linux
    name: Launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # a multi-line step must stop at the first failing command (the Windows default, pwsh, does not)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # scripts/ci-step.sh runs a command normally, but if it fails it also publishes the last lines of its output as an
      # error annotation, so a failed run explains itself (annotations are readable without signing in).
      - name: Install, test, package
        run: |
          bash scripts/ci-step.sh "Launcher: npm ci" npm ci
          bash scripts/ci-step.sh "Launcher: npm test" npm test
          bash scripts/ci-step.sh "Launcher: package" npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          path: |
            dist/ToolsLauncher-*
            !dist/*.blockmap
          if-no-files-found: error

  tool:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: windows-latest, script: 'dist:win' }
          - { os: ubuntu-22.04, script: 'dist:linux' }
        # setup: what `npm run setup` fetches (ffmpeg, a model, language data), or '' when the tool needs nothing
        tool:
          - { id: picture-converter, name: 'Picture Converter', setup: '' }
          - { id: audio-tagger, name: 'Audio Tagger', setup: '' }
          - { id: audio-converter, name: 'Audio Converter', setup: 'ffmpeg setup' }
          - { id: pdf-toolkit, name: 'PDF Toolkit', setup: '' }
          - { id: photo-privacy, name: 'Photo Privacy Cleaner', setup: '' }
          - { id: video-converter, name: 'Video Converter', setup: 'ffmpeg setup' }
          - { id: music-player, name: 'Music Player', setup: '' }
          - { id: audio-editor, name: 'Audio Editor', setup: 'ffmpeg setup' }
          - { id: duplicate-finder, name: 'Duplicate Finder', setup: 'ffmpeg setup' }
          - { id: ocr, name: 'Image Text Extractor', setup: 'language data' }
          - { id: stem-splitter, name: 'Stem Splitter', setup: 'ffmpeg and model setup' }
          - { id: bpm-key-finder, name: 'BPM & Key Finder', setup: 'ffmpeg setup' }
          - { id: background-remover, name: 'Background Remover', setup: 'model setup' }
          - { id: lyrics-maker, name: 'Lyrics Maker', setup: 'ffmpeg and model setup' }
          - { id: text-diff, name: 'Text & File Diff', setup: '' }
          - { id: file-renamer, name: 'Batch File Renamer', setup: '' }
          - { id: disk-space, name: 'Disk Space Visualizer', setup: '' }
          - { id: qr-studio, name: 'QR & Barcode Studio', setup: '' }
          - { id: password-vault, name: 'Password Vault', setup: '' }
          - { id: file-encryptor, name: 'File Encryptor & Hasher', setup: '' }
          - { id: markdown-notes, name: 'Markdown Notes', setup: '' }
          - { id: ebook-studio, name: 'Ebook Converter & Reader', setup: '' }
          - { id: voice-recorder, name: 'Voice Recorder & Cleaner', setup: 'ffmpeg setup' }
          - { id: photo-batch-editor, name: 'Photo Batch Editor', setup: '' }
          - { id: subtitle-maker, name: 'Subtitle Maker', setup: 'ffmpeg and model setup' }
          - { id: audio-inspector, name: 'Audio Inspector', setup: 'ffmpeg setup' }
    name: ${{ matrix.tool.name }} (${{ matrix.platform.os }})
    runs-on: ${{ matrix.platform.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/${{ matrix.tool.id }}/package-lock.json

      # the tools are built with the launcher's own copies of electron and electron-builder (../../node_modules)
      - name: Shared build tools
        run: |
          bash scripts/ci-step.sh "Shared build tools: npm ci" npm ci

      - name: ${{ matrix.tool.name }}
        working-directory: tools/${{ matrix.tool.id }}
        run: |
          bash ../../scripts/ci-step.sh "${{ matrix.tool.name }}: npm ci" npm ci
          if [ -n "${{ matrix.tool.setup }}" ]; then
            bash ../../scripts/ci-step.sh "${{ matrix.tool.name }}: ${{ matrix.tool.setup }}" npm run setup
          fi
          bash ../../scripts/ci-step.sh "${{ matrix.tool.name }}: npm test" npm test
          bash ../../scripts/ci-step.sh "${{ matrix.tool.name }}: package" npm run ${{ matrix.platform.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: tool-${{ matrix.tool.id }}-${{ matrix.platform.os }}
          path: tools/${{ matrix.tool.id }}/dist/*-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [launcher, tool] # every job must pass, so a broken build can never publish a half catalog
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build catalog.json from the real packages
        run: |
          node scripts/build-catalog.js \
            --artifacts artifacts \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" \
            --out artifacts/catalog.json \
            --require windows,linux
          ls -l artifacts
          cat artifacts/catalog.json

      # Third-party action: consider pinning to a commit SHA instead of a version tag.
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
