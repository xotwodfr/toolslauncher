<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
  <title>Audio Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <section class="left">
      <div id="banner" class="banner" hidden>ffmpeg could not be started, so conversion is unavailable.</div>
      <div id="drop" class="drop" tabindex="0" role="button" aria-label="Add audio files">
        <strong>Drop audio files or folders here</strong>
        <span class="muted">MP3, FLAC, WAV, OGG, Opus, M4A, AAC, WMA, AIFF, APE… (audio is extracted from video files too)</span>
        <div class="row center">
          <button id="addFiles" class="btn">Add files…</button>
          <button id="addFolder" class="btn">Add folder…</button>
        </div>
      </div>
      <div class="listhead">
        <span id="count" class="muted">No files</span>
        <button id="clear" class="btn ghost small" hidden>Clear</button>
      </div>
      <ul id="list" class="list"></ul>
    </section>

    <aside class="right">
      <h2>Output</h2>
      <label>Format
        <select id="format">
          <option value="mp3">MP3</option>
          <option value="m4a">AAC (M4A)</option>
          <option value="ogg">OGG Vorbis</option>
          <option value="opus">Opus</option>
          <option value="flac">FLAC (lossless)</option>
          <option value="wav">WAV (uncompressed)</option>
        </select>
      </label>
      <label id="bitrateRow">Bitrate
        <select id="bitrate"></select>
      </label>
      <label>Sample rate
        <select id="sampleRate">
          <option value="0">Keep original</option>
          <option value="22050">22.05 kHz</option>
          <option value="32000">32 kHz</option>
          <option value="44100">44.1 kHz</option>
          <option value="48000">48 kHz</option>
          <option value="96000">96 kHz</option>
        </select>
      </label>
      <label>Channels
        <select id="channels">
          <option value="0">Keep original</option>
          <option value="1">Mono</option>
          <option value="2">Stereo</option>
        </select>
      </label>
      <label class="check"><input id="keepTags" type="checkbox" checked> Keep tags and cover art</label>

      <label>Save to
        <div class="row">
          <input id="outDir" type="text" readonly value="Same folder as each file">
          <button id="pickOut" class="btn small">Browse</button>
          <button id="resetOut" class="btn ghost small" hidden>Reset</button>
        </div>
      </label>
      <p class="muted small">Originals are never changed or overwritten.</p>

      <div class="grow"></div>
      <div id="summary" class="summary" hidden></div>
      <button id="go" class="btn primary big" disabled>Convert</button>
      <button id="cancel" class="btn big" hidden>Cancel</button>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
